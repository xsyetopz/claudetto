name: Bug report
description: Report a defect in a claudetto plugin
labels: [bug]
body:
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
      placeholder: 2.1.310
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin and version
      description: The plugin name and its version, for example `claudetto` 0.28.0.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Add the output or the log lines that show the problem.
    validations:
      required: true
