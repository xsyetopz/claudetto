name: project-setup
description: Install betterleaks, which the secret scan tests run, and the oldest Claude Code the plugin supports, and have it write the plugin API declarations the type check reads.

runs:
  using: composite
  steps:
    - name: Install betterleaks
      shell: bash
      env:
        BETTERLEAKS_VERSION: 1.10.0
      run: |
        case "${{ runner.os }}:${{ runner.arch }}" in
          Linux:X64) asset="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" ;;
          macOS:X64) asset="betterleaks_${BETTERLEAKS_VERSION}_darwin_x64.tar.gz" ;;
          macOS:ARM64) asset="betterleaks_${BETTERLEAKS_VERSION}_darwin_arm64.tar.gz" ;;
          *) echo "Unsupported runner: ${{ runner.os }} ${{ runner.arch }}" >&2; exit 1 ;;
        esac
        curl --fail --silent --show-error --location \
          "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${asset}" \
          --output /tmp/betterleaks.tar.gz
        case "${asset}" in
          betterleaks_1.10.0_linux_x64.tar.gz) expected="9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe" ;;
          betterleaks_1.10.0_darwin_x64.tar.gz) expected="71b3f30602856e622008c248b1b47b2ba15b227f4a033e8bfdfa05a21ec7d531" ;;
          betterleaks_1.10.0_darwin_arm64.tar.gz) expected="91eaea97709d3308c7712574a56260539c65fbd0672711537aa68d566ea630b3" ;;
        esac
        echo "${expected}  /tmp/betterleaks.tar.gz" | shasum -a 256 -c -
        tar -xzf /tmp/betterleaks.tar.gz -C /tmp
        sudo install /tmp/betterleaks /usr/local/bin/betterleaks
        betterleaks --version
    # `MINIMUM_VERSION` in `plugins/claudetto/hooks/command.run/useSetup/settings.ts`; `tools/ci-claude.test.ts` fails when they differ.
    - shell: bash
      run: bun add --global @anthropic-ai/claude-code@2.1.323
    - shell: bash
      run: claude --version && just types
