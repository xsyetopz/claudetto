name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The local gate without the type check: lint, tests, validation, and the hook lab.
  # `bun check` needs `.claude-plugin/types/`, which Claude Code writes only when an interactive session loads the plugin,
  # so the type check runs only in the local `just check`.
  # Each recipe runs through a Bun script, so the same gate runs on Windows, Linux, and macOS.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun from `packageManager`, and the locked dev dependencies.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      # The version in `TESTED_VERSION` of `src/plugins/dotclaude/slices/setup/domain/facts.ts`.
      - run: bun add --global @anthropic-ai/claude-code@2.1.296
      - run: claude --version
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: just ci

  # The one check to require in branch protection: it fails unless every
  # matrix job succeeded, including when one was cancelled or skipped.
  all-green:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
        run: test "$CHECK" = success
