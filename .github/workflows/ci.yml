name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The project recipes of `just check`, run one by one so that `project.just` stays the one definition of each step.
  # The TypeScript workflow runs `typescript::verify`.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun from `packageManager`, and the locked dev dependencies.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - uses: ./.github/actions/project-setup
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # The `confine` specs need `bwrap` on Linux, and Ubuntu's AppArmor refuses the user namespace it makes unless the sysctl is off.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: just lint-markdown lint-hooks clones
      - run: just test
      - run: just validate
      - run: just lab

  # Each new commit message against `@commitlint/config-conventional`, the `commitlint` key of `package.json`.
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # What the ref adds over the default branch, which is the set a pull request lints, so a branch
      # push and its pull request agree on the verdict.
      #
      # `github.event.before` is not used for either. It names the ref's previous head, so a push
      # lints only what that push added and an older bad message rides along unseen until a pull
      # request reaches back past it. A force push makes it worse: the commit it names is orphaned and
      # absent from the clone, and `git rev-list` then fails the job with `Invalid revision range`.
      #
      # On the default branch itself the range is empty, and the last commit is linted instead.
      - env:
          BASE: ${{ github.event.repository.default_branch }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          FROM=$(git merge-base "origin/$BASE" "$TO")
          if [ "$FROM" = "$(git rev-parse "$TO")" ]; then
            bunx commitlint --last
          else
            bunx commitlint --from "$FROM" --to "$TO"
          fi
