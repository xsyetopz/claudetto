# Bun reads no `.env` file, so no secret of the developer reaches a test, a script, or a hook.
env = false

[install]
linker = "isolated"

[test]
# `bun test` collects every test file under the repository, so a `__tests__/` folder beside a source counts.
# `plugins/*/tests/` holds the hook labs, which import `claude-code/testing` and only `claude plugin test` runs.
# `archive/` holds the retired code of the same labs, and `external/` holds the checkouts of others.
pathIgnorePatterns = ["plugins/*/tests/**", "archive/**", "external/**"]
# Each temporary folder of the tests goes under one folder that the run removes at exit.
preload = ["./tests/support/tmp-root.ts"]
timeout = 5000
