schema: spec-driven

context: |
  This repository is a Claude Code plugin marketplace in ESM.
  Read `AGENTS.md` at the root first.
  It holds the rules, and this text does not copy them.
  Runtime scripts in `plugins/` are `.mjs` files for Node.js 22.18 and use only `node:` modules.
  A file in the import graph of `hooks/register.mjs` has no `node:` import.
  Add-on plugins work alone and import nothing from another plugin.
  Commands: `just check` (must pass before done), `just test FILE`, `just lab`.
  Keep each file at 300 lines or less.
  Write docs in STE with semantic line breaks and no semicolons.
  Put each code item in inline code.
  Add CHANGELOG entries under the version that is in work.
  Use env vars and flags of Claude Code.
  Add a `DOTCLAUDE_` env var only when no Claude Code setting fits.
  Use documented extension points and write no runtime code for a feature that Claude Code has.
