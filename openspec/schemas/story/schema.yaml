# Generated by `just generate` from `plugins/claudetto/modules/spec/presets/story/schema.yaml`. Edit the source and run `just generate`.
name: story
version: 1
description: One feature in an existing codebase - proposal, specs, design, review, tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why, what changes, and capabilities
    template: proposal.md
    instruction: |
      Write why the change is needed.
      Sections: **Why** (1-2 sentences), **What Changes** (bullets, mark breaking changes **BREAKING**), **Capabilities**, **Impact**.
      Under Capabilities, list each new capability (kebab-case path, named for a durable behavior) and each modified capability (the exact path under `openspec/specs/`).
      Read the related specs in `openspec/specs/` first, and reuse an existing path.
      Each listed capability gets a delta spec.
      Keep it to 1-2 pages, and leave the how to `design.md`.
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: Delta specs with clarify markers
    template: spec.md
    instruction: |
      Write one `specs/<capability-path>/spec.md` for each capability of the proposal, one file at a time, and skip a file that exists.
      A spec states observable behavior, inputs, outputs, errors, and constraints, and no class, library, or step.
      Use the headers `## ADDED Requirements`, `## MODIFIED Requirements` (copy the whole block and edit it), `## REMOVED Requirements` (with **Reason** and **Migration**), and `## RENAMED Requirements` (FROM:/TO:).
      Write each requirement as `### Requirement: <name>` with SHALL or MUST, and give it at least one `#### Scenario: <name>` (exactly four `#`) with WHEN and THEN.
      A new capability starts with `## Purpose` of 50 characters or more, and the delta of an existing capability has none.
      Write `[NEEDS CLARIFICATION: <question>]` in place of a guess, and ask the user.
    requires: [proposal]

  - id: design
    generates: design.md
    description: How to build it
    template: design.md
    instruction: |
      Write how to build the change: **Context**, **Decisions** (each with why and the alternatives), and **Risks / Trade-offs** as `[Risk] -> Mitigation`.
      Point to the proposal and the specs in place of a restatement.
      Ask the user in place of a guess when an open question would change the specs, the approach, or the tasks.
    requires: [proposal]

  - id: review
    generates: review.md
    description: Check that the artifacts agree
    template: review.md
    instruction: |
      Check that the proposal, the specs, the design, and the tasks agree.
      Tick or fix each item of the template, and list each gap under **Gaps**.
      Stop and ask the user while a gap or a `[NEEDS CLARIFICATION` marker is open.
    requires: [tasks]

  - id: tasks
    generates: tasks.md
    description: Implementation checklist
    template: tasks.md
    instruction: |
      Write the task list as checkboxes `- [ ] X.Y Task` under `## N.` headings, because the apply step parses them.
      Order the tasks by dependency, and keep each small enough for one session.
      Each task states how to verify it, and lands its own tests and docs.
    requires: [specs, design]

apply:
  requires: [review]
  tracks: tasks.md
  instruction: |
    Read the context files, do the pending tasks, and tick each one when done.
    After a change of behavior, run a fast check of the changed files.
    At the end of each task group, run the full checks.
    An edit that changes no behavior needs no check.
    Stop at a blocker.
