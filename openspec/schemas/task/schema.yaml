# Generated by `just generate` from `src/plugins/claudetto/slices/spec/skills/spec/schemas/task/schema.yaml`. Edit the source and run `just generate`.
name: task
version: 1
description: A bug fix, a small change, or a refactor with no change of behavior - proposal, tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why, what changes, and impact
    template: proposal.md
    instruction: |
      Write why the change is needed.
      Sections: **Why** (1-2 sentences), **What Changes** (bullets), **Impact**.
      List no capability, because this preset has no specs.
      When the change alters behavior, it is a `story`: tell the user, and do not go on with this preset.
    requires: []

  - id: tasks
    generates: tasks.md
    description: Implementation checklist
    template: tasks.md
    instruction: |
      Write the task list as checkboxes `- [ ] X.Y Task` under `## N.` headings, because the apply step parses them.
      Order the tasks by dependency, and keep each small enough for one session.
      Each task states how to verify it, and lands its own tests and docs.
    requires: [proposal]

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read the context files, do the pending tasks, and tick each one when done.
    After a change of behavior, run a fast check of the changed files.
    At the end of each task group, run the full checks.
    An edit that changes no behavior needs no check.
    Stop at a blocker.
