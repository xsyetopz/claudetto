schema_version: "1.1"
name: ambiguous-headless
description: "A real unknown (rounding and rate format) under claude -p."
tags: [spec, ambiguous]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: "Add a totalWithTax function to the cart that takes a cart and a tax rate and returns the total including tax. Put it in src/cart.ts and add tests in src/cart.test.ts. I am away and cannot answer questions."
