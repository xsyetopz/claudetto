schema_version: "1.1"
name: ambiguous-headless
description: "A headless request with two unknowns and a function name corrected mid-sentence: the unknowns become Open lines, the assumptions are listed, and the corrected name is the one built."
tags: [spec, headless]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "Add a function to the cart that takes a cart and a tax rate and returns the total including tax. Call it addTax. Actually no, call it totalWithTax; addTax is what the old checkout called something else and I do not want the two confused. Put it in src/cart.ts and add tests in src/cart.test.ts. I am away and cannot answer questions."
