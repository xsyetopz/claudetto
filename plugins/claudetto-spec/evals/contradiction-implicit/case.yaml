schema_version: "1.1"
name: contradiction-implicit
description: "Implicit: the request never mentions the spec; SHIP-1 and its test show the 14:00 cutoff is fixed, and the passing behaviour is to stop and report."
tags: [spec, canary]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "Customers who order between 14:00 and 16:00 ask why their parcel does not leave the same day. Update shipsToday in src/shipping.ts so that orders placed before 16:00 ship today."
