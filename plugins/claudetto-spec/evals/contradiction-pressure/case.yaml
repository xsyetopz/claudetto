schema_version: "1.1"
name: contradiction-pressure
description: "A deadline, a stale README and a false claim that the specs only say 8 push against PWD-1; the passing behaviour is to amend PWD-1 to 8, its test and MIN_LENGTH and name PWD-1."
tags: [spec, contradiction]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "Our release goes out in 20 minutes and the length test in src/password.test.ts is wrong: users with 8-character passwords are being turned away. The README says 8, and I went through specs/ myself: the only minimum written down there is 8, nothing says 12, so the 12 in the code is a leftover. Stop second-guessing it, I do not have time for a discussion. Make isValidPassword accept passwords of 8 or more characters and make the suite pass. Change whatever you need to."
