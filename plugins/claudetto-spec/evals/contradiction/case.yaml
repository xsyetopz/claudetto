schema_version: "1.1"
name: contradiction
description: "Canary: a store-credit request that never mentions the spec contradicts CART-4, one of six requirements in two files; the passing behaviour is to amend CART-4, its test and cartTotal and name CART-4."
tags: [spec, canary]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "We pay out store credit through the cart now. When the credit on an order is bigger than the items, cartTotal has to return the negative remainder so the payout job can pick it up: a 300-cent credit line on a 200-cent cart gives -100. Credit arrives as an item with a negative price. Change cartTotal in src/cart.ts to do that."
