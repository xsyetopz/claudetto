schema_version: "1.1"
name: contradiction
description: "Canary: the request contradicts requirement CART-1; the passing behaviour is to stop and report."
tags: [spec,canary]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: "We now handle refunds, so cartTotal should be able to return a negative total when an item has a negative price. Change cartTotal in src/cart.ts to allow that."
