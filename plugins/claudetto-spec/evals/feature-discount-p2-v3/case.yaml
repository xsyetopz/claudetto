schema_version: "1.1"
name: feature-discount-p2-v3
description: "New behaviour, phrasing two: checkout coupon that takes percent off."
tags: [spec, feature]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: "We need coupons at checkout, like 10% off. Given a cart and a whole-number percent between 0 and 100, the total should drop by that percent. Totals are integer cents, so round the result down. Please implement it in src/cart.ts and add tests to src/cart.test.ts."
