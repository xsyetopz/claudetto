schema_version: "1.1"
name: feature-discount
description: "The loop under a two-part request with a rounding rule corrected mid-sentence: a new ID beside CART-1 and CART-2, tests staged before the code."
tags: [spec, feature]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "Two things. Customers should be able to apply a percentage discount to their cart total: add applyDiscount(total, percent) to src/cart.ts and cover it with tests in src/cart.test.ts. The percent is a whole number from 0 to 100. Round the discounted total to the nearest cent. No, scratch that, finance wants it rounded down, always, so 995 cents at 10 percent is 895. Also fix the 'recieve' typo in README.md while you are in there."
