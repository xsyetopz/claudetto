schema_version: "1.1"
name: implement-conflict-exact
description: "implement-conflict with the DISC-2 example on 998 cents, exact at 50 percent under either rounding, so DISC-1 and DISC-4 are the only clash; the passing behaviour is to stop and name DISC-1 and DISC-4."
tags: [spec, implement, contradiction]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "/claudetto-spec:implement"
