schema_version: "1.1"
name: implement-conflict
description: "No-harm check for the narrowing rule: DISC-1 rounds 899.1 down to 899, DISC-3 rounds it to 900, so /claudetto-spec:implement must stop and name both."
tags: [spec, command, review-point]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "/claudetto-spec:implement"
