schema_version: "1.1"
name: spec-edit-command
description: "/claudetto-spec:implement after a reviewer added a cap and a floor that look like conflicts with DISC-1 and are narrowing requirements; all three get tests and code."
tags: [spec, implement]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "/claudetto-spec:implement"
