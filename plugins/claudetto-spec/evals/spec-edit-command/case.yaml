schema_version: "1.1"
name: spec-edit-command
description: "/claudetto-spec:implement after a review: the specs on disk, not the stale review note or the earlier turn, set the scope; a second spec file holds SHIP-1, the cap is 50, and two added scenarios fail a float factor and a blunt floor."
tags: [spec, implement]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "/claudetto-spec:implement"
