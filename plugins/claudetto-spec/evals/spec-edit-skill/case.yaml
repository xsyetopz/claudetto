schema_version: "1.1"
name: spec-edit-skill
description: "A reviewer's spec edit holds more than the request says: DISC-2 is new and DISC-1 now rounds to the nearest cent, while every old test still passes. Code and tests follow the spec as edited."
tags: [spec, edit]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "I reviewed specs/cart.md after your change and added DISC-2: a discount above 50 percent applies as 50. Make the code and tests match the spec."
