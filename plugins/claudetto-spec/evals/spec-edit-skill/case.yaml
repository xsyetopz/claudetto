schema_version: "1.1"
name: spec-edit-skill
description: "Review point, turn 2 of the single-skill path: the reviewer edits the spec after DISC-1 shipped with tests and code."
tags: [spec, review-point]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "I reviewed specs/cart.md after your change and added DISC-2: a discount above 50 percent applies as 50. Make the code and tests match the spec."
