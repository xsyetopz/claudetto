schema_version: "1.1"
name: spec-fix-skill
description: "Review point, turn 2 of the single-skill path: the reviewer corrects DISC-1 (round to nearest) after it shipped with tests and code."
tags: [spec, review-point]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "I reviewed specs/cart.md after your change and changed DISC-1: discounted totals round to the nearest cent, not down. Make the code and tests match the spec."
