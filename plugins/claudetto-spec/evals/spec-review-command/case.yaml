schema_version: "1.1"
name: spec-review-command
description: "The /claudetto-spec:spec-review command itself on the hollow-test fixture. Gaps by requirement ID: STOCK-2 has a hollow test, STOCK-3 has an untested scenario, STOCK-4 has no code; STOCK-1 is fully covered and must not be flagged."
tags: [spec-review-command]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: "/claudetto-spec:spec-review"
