schema_version: "1.1"
name: specify-discount
description: "/claudetto-spec:specify with a rounding rule corrected mid-request, beside a stub and a todo test that invite finishing the job; the command stops after the spec."
tags: [spec, specify]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "/claudetto-spec:specify Customers should be able to apply a percentage discount to their cart total through applyDiscount(total, percent) in src/cart.ts, covered by tests in src/cart.test.ts. The percent is a whole number from 0 to 100. The discounted total rounds to the nearest cent. Correction from finance: it rounds down, always, so 995 cents at 10 percent is 895. The stub and the todo test are already in place."
