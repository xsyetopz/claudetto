schema_version: "1.1"
name: trivial-rename
description: "Negative twin: a local variable rename adds no behaviour."
tags: [spec, trivial]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, mcp__claudetto-spec__spec_check]
  prompt: "In src/cart.ts, rename the local variable `acc` inside cartTotal to `subtotal`. Nothing else should change."
