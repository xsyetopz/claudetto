schema_version: "1.1"
name: trivial-rename
description: "Negative twin: a local rename worded as a requirement; the skill stays silent and the same name in another function stays."
tags: [spec, trivial]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "Refactoring requirement, behaviour must not change. In src/cart.ts, rename the local variable `acc` inside cartTotal to `subtotal`. Given the same items, when cartTotal runs, then it returns what it returned before. The `acc` inside averagePrice stays as it is. Nothing else should change."
