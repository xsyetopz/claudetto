schema_version: "1.1"
name: trivial-typo
description: "Negative twin: a prose typo fix worded as a requirement with Given, When, Then; the skill stays silent and the misspelled code name stays."
tags: [spec, trivial]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools:
    [
      Read,
      Glob,
      Grep,
      Skill,
      Write,
      Edit,
      Bash,
      mcp__claudetto-spec__spec_check
    ]
  prompt: "Requirement from the docs team. Given README.md, when a customer reads it, then the word 'receive' is spelled right; the prose says 'recieve' today. Acceptance: no misspelled prose in README.md, the `recieveTotal` code name keeps its spelling, and no other file changes."
