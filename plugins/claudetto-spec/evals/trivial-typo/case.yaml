schema_version: "1.1"
name: trivial-typo
description: "Negative twin: a typo fix adds no behaviour."
tags: [spec, trivial]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: 'There is a typo in README.md: "recieve" should be "receive". Please fix it.'
