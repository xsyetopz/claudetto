schema_version: "1.1"
name: artifact-short-answer
description: "REQ-REPLY-151 (no-harm twin): a short answer stays in the reply and no file is created (issue #139)."
tags: [reply, artifact, trivial]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, mcp__claudetto__patch]
  prompt: "What one-line git command shows the files changed in the last commit?"
