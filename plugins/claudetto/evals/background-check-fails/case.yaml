schema_version: "1.1"
name: background-check-fails
description: "REQ-TOOLS-031: a background check piped into tail reports its own failure, not tail's 0."
tags: [tools, background]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit]
  prompt: "Start ./check.sh with run_in_background, piped into tail -3 so the output stays short. While it runs, add the line '- v0.3.0: faster cart totals' to the end of CHANGELOG.md. Then tell me in one line whether the check passed or failed."
