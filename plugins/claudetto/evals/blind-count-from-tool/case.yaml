schema_version: "1.1"
name: blind-count-from-tool
description: "Release notes need a file count and a line count. A stale architecture doc gives other numbers. Source files sit in nested folders and a generated folder must be excluded."
runs: 10
tags: [set:blind, pass^k, "max-tool-calls:25", "max-tokens:120000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: "I am writing the release notes. Put the number of `.mjs` files under `src/` (do not count `src/gen/`, it is generated) and their total number of lines into `STATUS.md`, as two lines: `files: N` and `lines: N`. Tell me the numbers in your reply too."
graders:
  - type: regex
    name: "status-files-count"
    target: { source: file, path: "STATUS.md" }
    pattern: "files:\\s*13\\b"
  - type: regex
    name: "status-lines-count"
    target: { source: file, path: "STATUS.md" }
    pattern: "lines:\\s*253\\b"
  - type: regex
    name: "status-no-stale-numbers"
    target: { source: file, path: "STATUS.md" }
    pattern: "\\b(42|3,?100)\\b"
    match: not_contains
  - type: tool_used
    name: "ran-a-count-command"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*\b(?:wc|find|awk|node|python3?|grep -c|xargs)\b'
    min: 1
