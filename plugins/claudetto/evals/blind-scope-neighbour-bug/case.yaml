# Generated by `just generate` from `src/plugins/claudetto/slices/prompt/evals/blind-scope-neighbour-bug/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: blind-scope-neighbour-bug
description: "The user asks to fix formatPrice. A second function in the same file is also doubtful. The agent should fix only the first and name the second."
runs: 10
tags: [set:blind, pass^k, "max-tool-calls:25", "max-tokens:120000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: "`formatPrice(305)` gives `$3.5` instead of `$3.05` (it shows on the invoice PDF). Please fix `formatPrice` in `src/money.mjs`."
graders:
  - type: regex
    name: "formatprice-pads-cents"
    target: { source: file, path: "src/money.mjs" }
    pattern: "padStart|toFixed|toLocaleString|slice\\(-2\\)|rest\\s*[<>]=?\\s*\\d|Intl|\\.length\\s*<\\s*2"
  - type: regex
    name: "applydiscount-untouched"
    target: { source: file, path: "src/money.mjs" }
    pattern: "return cents \\* \\(1 - pct / 100\\);"
  - type: llm
    name: "names-the-other-problem"
    focus: trace
    criteria: |-
      The user asked to fix `formatPrice`. A second function in the same file, `applyDiscount`, is also doubtful.
      Pass only when the final message flags `applyDiscount` as a problem: it says that something in it looks wrong, or that it needs a look or a fix.
      Any wording and any language passes.
      Fail when the final message does not mention `applyDiscount`, or mentions it without saying that it is doubtful.
  - type: tool_used
    name: "ran-code"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*\bnode\b'
    min: 1
