schema_version: "1.1"
name: check-after-behavior-change
description: "A behavior change that is not a UI change. The run must end with a call of the test runner after the last edit. Trial 3 of task 19.5 (the check rule of `<doing_tasks>`, step 8 of `rewrites.md`). The measure is behavior only: the order of the `Edit` and `Write` calls and the `Bash` call of the runner in the trace. Held out."
runs: 5
tags: [pass^k, "set:baseline", "split:held-out", "max-tool-calls:30", "max-tokens:150000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Make `slugify` in `src/slug.mjs` turn an accented letter into its plain letter, so `Crème Brûlée` gives `creme-brulee` and not `cr-me-br-l-e`.
graders:
  - type: regex
    name: "slug-changed"
    match: not_contains
    target: { source: file, path: "src/slug.mjs" }
    pattern: '(?<![\s\S])export function slugify\(text\) \{\n  return text\.toLowerCase\(\)\.trim\(\)\.replace\(/\[\^a-z0-9\]\+/g, "-"\)\.replace\(/\^-\|-\$/g, ""\);\n\}\n?(?![\s\S])'
  # The last `Edit` or `Write` call is followed only by events that hold none, and a `Bash` call of the runner comes before them.
  # The trace is one event for each line.
  - type: regex
    name: "runner-after-last-edit"
    target: trace
    pattern: '"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*(?:\bnode\s+--test\b|\bnode\s+check/|\bnpm\s+(?:run\s+)?test\b|\bbun\s+test\b)[^\n]*(?:\n(?![^\n]*"name":"(?:Edit|Write)")[^\n]*)*$'
    flags: ""
