schema_version: "1.1"
name: commit-msg-limit
description: "ISSUES-part3:113: asked for a commit with a detailed body, the agent wraps the body to the commit-msg hook's 100 character limit before the first attempt, so no line of the committed message is over the limit."
tags: [conduct, git, hooks]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "the retry change in src/fetch.ts is staged. commit it with a detailed body: why the backoff is capped, what the old behaviour did to the server, and how to tune it."
