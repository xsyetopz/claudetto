# Generated by `just generate` from `src/plugins/claudetto/slices/styles/evals/concise-stays-thorough/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: concise-stays-thorough
description: "Under the style `claudetto:Concise`, a task with an implicit scope gets all its parts and a test run. Task 2.3 of `post-0-2-0`: the line `Keep the work thorough.` of `Concise.md`. The style is active only on a checkout where `Concise.md` has `force-for-plugin: true` (branch `eval/2-3-base`), because the eval child reads user settings only."
runs: 10
tags: [pass^k, "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    Make the functions in `src/` reject arguments that are not numbers.
    Cover that with tests, and run them.
graders:
  - type: regex
    name: "add-validates"
    target: { source: file, path: "src/add.mjs" }
    pattern: 'TypeError'
  - type: regex
    name: "sub-validates"
    target: { source: file, path: "src/sub.mjs" }
    pattern: 'TypeError'
  - type: regex
    name: "mul-validates"
    target: { source: file, path: "src/mul.mjs" }
    pattern: 'TypeError'
  # A new or changed file in `check/`: the trace holds a `Write` or an `Edit` of a path there.
  - type: regex
    name: "tests-added"
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*?"file_path":"[^"]*check/'
  - type: tool_used
    name: "tests-run"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*node\s+--test'
    min: 1
  # A phrase list fits one written language only, so a judge reads the final message in any language.
  - type: llm
    name: "plain-reply"
    focus: last_message
    criteria: |-
      Pass only when the first sentence of the final message, in whatever language it is written,
      states the result of the task: what changed, what was found, or what failed.
      Fail when the first sentence praises the question, apologizes, restates the request,
      or announces what the agent will do next.
      Fail when the last sentence offers more help, invites the user to ask again,
      or repeats what the message already said.
      An offer of help is a sentence such as "I can add tests if you want" or "Let me know if you need more".
      Pass a last sentence that names an extra as a fact about the work, such as "No test covers the empty list",
      or that asks for an input that only the user has, such as a file path or a key, to finish the task.
