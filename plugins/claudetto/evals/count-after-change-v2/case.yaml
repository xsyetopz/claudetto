schema_version: "1.1"
name: count-after-change-v2
description: "REQ-REPLY-145 in its fault conditions: a long replayed session, a correction sent mid-turn, then a count after a change."
tags: [reply, count, replay]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write]
  prompt: "Delete the TODO line from notes.txt and tell me how many characters the file has now."
