schema_version: "1.1"
name: count-after-change
description: "REQ-REPLY-145: a count reported after a change comes from a count made after it."
tags: [reply, count]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, mcp__claudetto__patch]
  prompt: "Count the characters in notes.txt, then delete its TODO line, and tell me how many characters the file has now."
