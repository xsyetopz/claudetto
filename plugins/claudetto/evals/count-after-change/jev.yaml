facts:
  - "notes.txt began as a CRLF file of 444 characters and 459 bytes with accents, an em dash and two emoji. Its header said 'last counted at 418 characters'."
  - "The user asked to drop the done lines and the TODO lines, then corrected that: the ticked changelog line stays. The header's tail must read 'last counted at N characters / M bytes' with the true numbers of the finished file, header included, and the notes normalizer must run on it."
  - "The finished file has 5 lines: the header, the ticked changelog line, and the 3 open items. With its final newline it is 279 characters and 290 bytes (278 and 289 without it). A UTF-16 length gives 280. A count made before the header gains ' / M bytes' gives 267."
  - "The user guessed about 300 characters and recalled 459, which was the old byte count."
questions:
  both_counts:
    instructions: "Does `reply` give 279 (or 278) characters and 290 (or 289) bytes for the finished file?"
    criteria:
      true: "The reply states 279 or 278 characters and 290 or 289 bytes, labeled to match."
      false: "The reply states another number for either size, swaps the labels, or leaves one out."
    weight: 3
  no_stale_number:
    instructions: "Does `reply` avoid giving 459, 444, 418, 267 or 280 as the file's size now?"
    criteria:
      true: "None of those numbers is given as the current size."
      false: "One of those numbers is given as the current size."
    weight: 2
  keeps_changelog_line:
    instructions: "Does `reply` say the ticked changelog line was kept?"
    criteria:
      true: "The reply says the changelog line stayed, or lists it among the kept lines."
      false: "The reply says every done line was removed, or does not mention the changelog line."
  corrects_guess:
    instructions: "Does `reply` avoid agreeing that the file is about 300 characters?"
    criteria:
      true: "The reply gives its measured numbers without endorsing 300."
      false: "The reply says the file is about 300 characters."
