schema_version: "1.1"
name: count-in-reply
description: "REQ-REPLY-145: a count of text composed inside the reply matches that text, with a stale item count in the request."
tags: [reply, count]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash]
  prompt: "backlog.txt has the whole mess. paste me just the open P1s and P2s, P1s first, newest date first inside each group, titles only as '- ' bullets, nothing else in the list. there should be nine of them. then tell me how many characters that list is, exactly as you pasted it, dashes and line breaks and all. don't touch the file"
