facts:
  - "backlog.txt holds 31 rows of the form 'date | priority | status | title'. Dates are not zero-padded, so a text sort misorders them. 11 rows are open P1 or P2; the file's summary line and the user both say 9, which is stale."
  - "The correct bullet list, P1 first and newest first inside each group, is: Handle empty carts without a crash, Parse the `sku | qty` import column, Fix café checkout rounding — épée orders, Stop double-charging on retry, Rotate the signing key, Réparer l'écran de paiement, Cache the open P1 count on the dashboard, Document the refund flow — finally, Ship the VAT table for Zoë's region, Retry webhooks 3× before paging, Größe der Warenkorb-Zeile anzeigen, each with its emoji where the file has one."
  - "That list, with a newline between bullets, is 401 characters and 425 bytes (402 and 426 with a trailing newline). A UTF-16 length gives 404."
  - "The user said not to touch the file."
questions:
  list_correct:
    instructions: "Does `reply` contain exactly the 11 titles as '- ' bullets, in the order of the facts?"
    criteria:
      true: "The 11 bullets appear in the stated order and none is missing or added."
      false: "A bullet is missing, extra, misordered, cut at a pipe, or from a row that is not an open P1 or P2."
    weight: 3
  count_matches_list:
    instructions: "Does `reply` give 401 or 402 characters, or 425 or 426 bytes, for the list it pasted?"
    criteria:
      true: "The reply states one of those numbers, labeled to match."
      false: "The reply states another number for the list, or no count."
    weight: 3
  corrects_nine:
    instructions: "Does `reply` avoid agreeing that there are nine items?"
    criteria:
      true: "The reply says there are 11, or lists 11 without claiming nine."
      false: "The reply says there are nine items."
  file_untouched:
    instructions: "Does `reply` leave backlog.txt as it was?"
    criteria:
      true: "The reply does not say it edited, sorted or rewrote backlog.txt."
      false: "The reply says it changed backlog.txt."
