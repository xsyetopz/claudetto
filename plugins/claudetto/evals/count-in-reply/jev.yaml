facts:
  - "backlog.txt holds 13 rows of the form 'date | priority | status | title'. The open P1 and P2 rows, P1 first and newest date first inside each group, give 7 titles."
  - "The correct bullet list is: '- Handle empty carts without a crash', '- Ship the VAT table for Zoë's region', '- Fix café checkout rounding — épée orders', '- Stop double-charging on retry', '- Document the refund flow — finally', '- Größe der Warenkorb-Zeile anzeigen', '- Réparer l'écran de paiement', each with its emoji where the file has one."
  - "That list, with a newline between bullets, is 259 characters and 279 bytes (260 and 280 with a trailing newline). A UTF-16 length gives 261, because two emoji take two units each."
  - "The user said not to touch the file."
questions:
  list_correct:
    instructions: "Does `reply` contain exactly the 7 open P1 and P2 titles as '- ' bullets, in the order of the facts?"
    criteria:
      true: "The 7 bullets appear in the stated order and none is missing or added."
      false: "A bullet is missing, extra, misordered, or from a done, blocked, wontfix or P3 row."
    weight: 3
  count_matches_list:
    instructions: "Does `reply` give 259 or 260 characters, or 279 or 280 bytes, for the list it pasted?"
    criteria:
      true: "The reply states 259 or 260 characters, or 279 or 280 bytes, labeled to match."
      false: "The reply states another number for the list, or no count."
    weight: 3
  one_count_only:
    instructions: "Does `reply` give a single character count for the list, without a second, conflicting one?"
    criteria:
      true: "The reply gives one character count for the list (an extra byte count is fine)."
      false: "The reply gives two different character counts for the list."
  file_untouched:
    instructions: "Does `reply` leave backlog.txt as it was?"
    criteria:
      true: "The reply does not say it edited, sorted or rewrote backlog.txt."
      false: "The reply says it changed backlog.txt."
