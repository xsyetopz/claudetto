schema_version: "1.1"
name: delegate-two-files
description: "REQ-GOAL-030 outcome leg: a prompt that asks for subagents on two independent file changes; graded on the files only."
tags: [goal, feature]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Agent]
  prompt: "Delegate this work to subagents, one subagent for each file. In src/tax.ts change TAX_RATE from 0.2 to 0.25. In src/limits.ts change MAX_RETRIES from 3 to 5. The two changes are independent. Change nothing else."
