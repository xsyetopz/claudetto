# Generated by `just generate` from `src/plugins/claudetto/slices/agents/evals/delegation-related-grouped/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: delegation-related-grouped
description: "Four related questions, one investigator subagent. Port of delegation/related-grouped."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Agent]
  prompt: |-
    Answer these related questions with the path of one file for each, in `ANSWERS.md`.
    1. Which file defines `loadConfig`?
    2. Which file reads the `RETRY_MAX` variable?
    3. Which file calls `flushQueue`?
    4. Which file defines `toSlug`?
    Use one investigator subagent for all the questions.
graders:
  - type: regex
    name: "answer-loadconfig"
    target: { source: file, path: "ANSWERS.md" }
    flags: m
    pattern: '^[\s|*>-]*1[.):|*]*\s(?:(?!src/)[^\n])*src/config/load\.mjs(?:(?!src/)[^\n])*$'
  - type: regex
    name: "answer-retrymax"
    target: { source: file, path: "ANSWERS.md" }
    flags: m
    pattern: '^[\s|*>-]*2[.):|*]*\s(?:(?!src/)[^\n])*src/net/retry\.mjs(?:(?!src/)[^\n])*$'
  - type: regex
    name: "answer-flushqueue"
    target: { source: file, path: "ANSWERS.md" }
    flags: m
    pattern: '^[\s|*>-]*3[.):|*]*\s(?:(?!src/)[^\n])*src/jobs/run\.mjs(?:(?!src/)[^\n])*$'
  - type: regex
    name: "answer-toslug"
    target: { source: file, path: "ANSWERS.md" }
    flags: m
    pattern: '^[\s|*>-]*4[.):|*]*\s(?:(?!src/)[^\n])*src/text/slug\.mjs(?:(?!src/)[^\n])*$'
  - type: tool_used
    name: "one-subagent"
    tool: Agent
    min: 1
    max: 1
  - type: tool_used
    name: "investigator-agents"
    tool: Agent
    input_match: '"subagent_type":"(?:claudetto:)?investigator"'
    min: 1
  - type: tool_used
    name: "no-other-agent-type"
    tool: Agent
    input_match: '"subagent_type":"(?!(?:claudetto:)?investigator")'
    min: 0
    max: 0
  # Whether a message asks the user something is not a property of a punctuation mark or a phrase in every language, so a judge reads it.
  - type: llm
    name: "no-plain-question"
    focus: last_message
    criteria: |-
      Pass only when the final message, in whatever language it is written, reports the result
      and does not ask the user a question, does not offer a choice of next steps,
      and does not hand the user work such as running a command.
      Fail when it ends with a question, asks for permission, or tells the user to run something.
