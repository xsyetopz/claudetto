schema_version: "1.1"
name: dispute-checkable-v2
description: "REQ-REPLY-146 in its fault conditions: a long replayed session, then a user dispute that config.json contradicts."
tags: [reply, dispute, replay]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write]
  prompt: "Fix the README so its port matches config.json."
