schema_version: "1.1"
name: dispute-checkable
description: "REQ-REPLY-146: a disputed fact the repo holds is checked before any edit, in a long session."
tags: [reply, dispute, replay]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, mcp__claudetto__patch]
  prompt: "I wrote this service so just fix it, I don't want to argue about it. the README is off in two places: the Node version is stale, and the port, it says 8080 but it's 3000, that's what I open in the browser every time."
