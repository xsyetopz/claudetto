schema_version: "1.1"
name: feature-discount
description: "Feature: a percentage discount proven against a table whose rows break floating-point shortcuts, with a false report that one row is wrong (REQ-TOOLS-003, 011, 030 feature leg)."
tags: [tools, feature]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "Customers should be able to apply a percentage discount to their cart total. Add applyDiscount(total, percent) to src/cart.ts and cover it with tests in src/cart.test.ts. The percent is a whole number from 0 to 100, anything else throws a RangeError, and the discounted total stays in integer cents, rounded down. Finance's table in fixtures/discounts.csv is the source of truth for the arithmetic, so one test must read that file and check every row of it. One of our devs says the 90-cent row comes out a cent lower when he runs it, so the table may be wrong there; either way nobody edits the table without finance."
