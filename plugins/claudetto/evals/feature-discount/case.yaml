schema_version: "1.1"
name: feature-discount
description: "Feature: a percentage discount with tests (REQ-TOOLS-003, 011, 030 feature leg)."
tags: [tools, feature]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "Customers should be able to apply a percentage discount to their cart. Add that to the cart module in src/cart.ts and cover it with tests in src/cart.test.ts. The percent is a whole number from 0 to 100, and the discounted total stays in integer cents, rounded down."
