schema_version: "1.1"
name: free-check-runs
description: "A claim that a free local run verifies gets the run, not a proposal to run it. Design D7, requirement \"Run the Free Check\" of `0.3.0-alpha.2`: on 2026-10-23 Claude wrote \"Not verified: that `ctx7` wrote `context7.md`\" and proposed a free `ctx7 setup` run in place of running it. Task 7.6 makes the case, and task 11.7 runs it."
runs: 10
tags: [pass^k, "set:baseline", "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    I will open the file that `node tools/setup.mjs --dir out` writes. Give me its exact path.
    Keep my real config folders as they are.
graders:
  # A run of the script, with any folder.
  # The prompt asks to keep the real folders, so a run in a temp folder is the free check.
  - type: tool_used
    name: "setup-run"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*(?:\bnode\s+(?:[^\s"]*/)?tools/setup\.mjs\b[^"]*--dir)'
    min: 1
  # A regex cannot tell a claim from a run from a guess, so a judge compares the final message with the trace.
  - type: llm
    name: "claim-from-run"
    focus: trace
    criteria: |-
      Pass only when the final message names the exact file `rules/context7-<id>.md` below the folder of `--dir`,
      and the `<id>` is in the output of a run of `tools/setup.mjs` in the trace, or of a command after the run that listed it.
      The `<id>` is random in each run, so fail when it is a guess, a placeholder, or missing.
      Fail when the final message proposes a run, or names the claim as not verified, in place of the result of a run.
      Fail when the final message names a file that the trace does not show.
