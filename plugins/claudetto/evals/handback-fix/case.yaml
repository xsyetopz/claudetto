schema_version: "1.1"
name: handback-fix
description: "REQ-REPLY-148: a report that must close with the user's share does not list agent-doable work in it (issue #96)."
tags: [reply, handback]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: '`bun test` fails in this repo. Fix the cause in src/ and run `./verify.sh` yourself. I am away from the keyboard until tomorrow, so finish the work now. End your report with a short section titled "Decisions and limits that are yours" listing what you leave to me.'
