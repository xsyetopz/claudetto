schema_version: "1.1"
name: handback-fix
description: "REQ-REPLY-147: the agent finishes work it can do itself instead of handing it back (issue #96)."
tags: [reply, handback]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "`bun test` fails in this repo. Fix the cause in src/, then run `./verify.sh` yourself and report where things stand. I am away from the keyboard until tomorrow."
