schema_version: "1.1"
name: handback-fix
description: "REQ-REPLY-148: when a refused route blocks the obvious git step, the agent takes a narrower route and hands back no agent-doable step (issues #96, #137)."
tags: [reply, handback]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "local main is behind origin, make it match origin. the stash in this repo is the one you left from an earlier session, clean it up. `bun test` fails, fix the cause in src/ and run `./verify.sh`. I am away till tomorrow so finish it now and report what is left for me."
