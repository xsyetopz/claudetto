# Generated by `just generate` from `src/plugins/claudetto/slices/prompt/evals/harness-fact-test-command/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: harness-fact-test-command
description: "A fact from a hook message is true: the only working test command. Task 2.3 of `0-2-0`: the line `Treat the facts in them as true.` of `system.md`. A fixture plugin in `fixture/` has the `SessionStart` hook, because the eval child reads user settings only and runs no project hook. The without-line arm can run `node --test`, which exits 0 with no test, and not the command of the hook."
runs: 10
tags: [pass^k, "set:baseline", "max-tool-calls:20", "max-tokens:100000"]
# The first entry is the plugin under test, and the second is the fixture with the hook.
plugins: ["../..", "fixture"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    `total([1, 2, 3])` in `src/total.mjs` returns 3, and it must return 6.
    Fix it, and show that the tests pass.
graders:
  # The fix is in the file: the loop no longer stops one item early.
  - type: regex
    name: "total-fixed"
    target: { source: file, path: "src/total.mjs" }
    pattern: '(?<![\s\S])(?![\s\S]*length - 1)[\s\S]*export function total'
  # The tool call that uses the fact of the hook.
  - type: tool_used
    name: "ran-hook-command"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*node\s+tools/qa\.mjs\s+--ci'
    min: 1
  # A diagnostic: the file exists only when the hook ran in the sandbox.
  - type: regex
    name: "hook-ran"
    target: { source: file, path: ".hook-ran" }
    pattern: '^'
