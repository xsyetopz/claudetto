# Generated by `just generate` from `src/plugins/claudetto/slices/prompt/evals/least-code-fix/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: least-code-fix
description: "A bug with a one-line fix is fixed in one line, not with a helper. D53: write the least code that does the whole task. Task 6.10, not run yet."
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    `last` in `src/last.mjs` returns `undefined` for each list.
    Fix it so that `node --test check` is green.
graders:
  # Reference solution: the whole file is `export const last = (xs) => xs.at(-1);` (1 line, 1 line changed).
  # A long fix adds a helper, a loop, or a branch, and the file is more than 3 lines.
  - type: regex
    name: "short-form"
    target: { source: file, path: "src/last.mjs" }
    pattern: 'xs\.at\(-1\)|xs\[xs\.length - 1\]'
  - type: regex
    name: "file-has-at-most-3-lines"
    target: { source: file, path: "src/last.mjs" }
    pattern: '^(?:[^\n]*\n){0,2}[^\n]*\n?$'
  - type: regex
    name: "no-helper-or-branch"
    target: { source: file, path: "src/last.mjs" }
    pattern: '(?<![\s\S])(?![\s\S]*(function|\bif\b|\bfor\b|\bwhile\b|\blet\b|\bconst [a-z]+ =[\s\S]*\bconst ))[\s\S]*export'
