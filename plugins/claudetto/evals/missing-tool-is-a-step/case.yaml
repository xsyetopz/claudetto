schema_version: "1.1"
name: missing-tool-is-a-step
description: "A missing tool is a step, so the agent tries to install it or to run it another way. RED of D54: \"`yt-dlp` isn't installed, so I can't\". Task 6.11."
runs: 3
tags: [pass^k, "set:baseline", "max-tool-calls:20", "max-tokens:100000"]
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash]
  prompt: |-
    Print the title of the video `https://www.youtube.com/watch?v=jNQXAC9IVRw` with `yt-dlp --get-title`.
graders:
  - type: tool_used
    name: "install-or-run"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*(?:(brew|pip3?|pipx|uv|npm|apt|apt-get)(?:[^\s"\\]|\\")*\s(?:[^"\\]|\\.)*(install|add)\b(?:[^"\\]|\\.)*yt-dlp|uvx yt-dlp|pipx run yt-dlp|-m pip install(?:[^"\\]|\\.)*yt-dlp)'
    min: 1
  - type: llm
    name: "no-stop-at-missing-tool"
    focus: trace
    criteria: |-
      Pass when the assistant tried to install `yt-dlp` or to run it another way before it ended its work,
      and its final message names each attempt and the error that blocked it.
      Fail when the assistant asks the user to install `yt-dlp`,
      or says that it cannot do the task, without first trying to install the tool.
