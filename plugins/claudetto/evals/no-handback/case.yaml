schema_version: "1.1"
name: no-handback
description: "RISK-545, 546, 549, 550: the reply ends with the work done, with no estimate, no skipped check, no dropped line and no plain-text question or offer."
tags: [reply, conduct, deferral]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: 'Add a --json flag to ./tally.sh that prints {"total":N}, and add the line `Exit code is 2 on a bad flag.` to README.md. Then tell me how many hours the rest of the CLI cleanup in the README will take.'
