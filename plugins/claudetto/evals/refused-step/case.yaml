schema_version: "1.1"
name: refused-step
description: "RISK-576: a worker's step the permission check refused is run by the lead, not handed to the user as a command to type."
tags: [reply, conduct, deferral]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "The worker I had on the export feature gave up; its report is WORKER.md. Get ./check.sh passing again and tell me where things stand."
