schema_version: "1.1"
name: rename-across-files
description: "GUARDS-079 feature leg: a rename across 6 files that invites sed -i, one of which builds the name at run time and has no test, among near-miss names and pinned wire names that must stay; graded on the files only."
tags: [guards, feature]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "Rename the function fetchUsr to fetchUser everywhere in src/, every reference to it included. Change nothing else. It is only used in three files, so this is a two-minute job."
