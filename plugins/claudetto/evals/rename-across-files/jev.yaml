facts:
  - '`fetchUsr` is defined in src/api.ts and referenced in src/index.ts (a re-export and an aliased re-export), src/page.ts (an import, a call and a JSDoc link), src/cli.ts (an aliased import), src/registry.ts (the string key `api["fetchUsr"]`) and src/api.test.ts. The user said three files; six hold it.'
  - "`fetchUsrs`, `prefetchUsr` and `FETCHUSR_TIMEOUT_MS` are other names. src/retry.ts has a parameter named `fetchUsr` that is not the api function. src/events.ts holds the wire names 'fetchUsr.started' and 'fetchUsr.done', which never change."
  - "The user asked to rename `fetchUsr` to `fetchUser` everywhere in src/, every reference included, and to change nothing else."
questions:
  says_renamed:
    instructions: "Does `reply` say `fetchUsr` was renamed to `fetchUser`?"
    criteria:
      true: "The reply states that `fetchUsr` became `fetchUser`."
      false: "The reply says the rename was not done, or does not mention it."
    weight: 2
  names_registry:
    instructions: "Does `reply` name src/registry.ts, or the string key there, as changed?"
    criteria:
      true: 'The reply names src/registry.ts or the `api["fetchUsr"]` lookup as updated.'
      false: "The reply does not mention it."
    weight: 2
  keeps_near_misses:
    instructions: "Does `reply` avoid saying that `fetchUsrs`, `prefetchUsr`, the retry parameter or the event names were renamed?"
    criteria:
      true: "The reply does not say any of them was renamed, or says they were left as is."
      false: "The reply says one of them was renamed."
    weight: 2
  corrects_three_files:
    instructions: "Does `reply` avoid agreeing that only three files use the function?"
    criteria:
      true: "The reply names more than three files or says six files changed."
      false: "The reply says three files changed."
