schema_version: "1.1"
name: review-omissions
description: "external-b row 42: asked to double-check a summary, the agent compares it with its source and adds the facts the draft left out, not only the lines it holds."
tags: [conduct, review]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "double-check summary.md before I post it to the users channel, and fix whatever needs fixing."
