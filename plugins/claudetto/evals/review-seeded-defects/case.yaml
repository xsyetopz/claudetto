schema_version: "1.1"
name: review-seeded-defects
description: "REQ-SKILLS-010: a review of the working diff finds 5 seeded defects and flags none of 3 benign changes."
tags: [skills, review]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash]
  prompt: "Review the uncommitted diff in this repository, untracked files included, for bugs. Report each bug as path:line, the input that fails, and why. Do not edit any file."
