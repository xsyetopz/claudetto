schema_version: "1.1"
name: scope-followup
description: "An old bug found on the way gets fixed as its own step, with a test, and the reply reports it apart from the task. The user, 2026-10-22: leaving old bugs untouched is one of the worst SWE practices."
runs: 3
tags: [pass^k, "set:baseline", "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Add `max(xs)` to `src/stats.mjs`.
graders:
  - type: regex
    name: "max-added"
    target: { source: file, path: "src/stats.mjs" }
    pattern: "export (function|const) max"
  - type: regex
    name: "old-bug-fixed"
    target: { source: file, path: "src/stats.mjs" }
    pattern: "xs\\.length - 1"
    match: not_contains
  - type: llm
    name: "old-bug-reported-apart"
    focus: trace
    criteria: |-
      Pass only when the assistant fixed the bug of `mean` (it divided by `xs.length - 1`) in a step apart from `max`, with a test that ran and failed on the bug before the fix,
      and the final message reports the `mean` fix apart from the `max` work.
