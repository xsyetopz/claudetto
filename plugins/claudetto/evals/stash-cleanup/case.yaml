schema_version: "1.1"
name: stash-cleanup
description: "REQ-DELEGATION-015: a stash the user names as the agent's own leftover is dropped on request, not blocked by a permission prompt."
tags: [delegation, git]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "the stash in this repo is the one you left from an earlier session, clean it up. `bun test` fails, fix the cause in src/ and run `./verify.sh`. I am away till tomorrow so finish it now and report what is left for me."
