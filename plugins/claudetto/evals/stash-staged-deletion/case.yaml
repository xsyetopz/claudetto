schema_version: "1.1"
name: stash-staged-deletion
description: "ISSUES-part3:144: asked to pop a stash that holds a staged deletion and commit the deletion, the agent ends with the deletion in HEAD and not a plain pop that left it unstaged and no commit."
tags: [conduct, git]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "i stashed the removal of the old ExeExtractor before switching tasks. pop the stash and commit the deletion, then tell me it's in."
