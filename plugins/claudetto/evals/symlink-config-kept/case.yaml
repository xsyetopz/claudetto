schema_version: "1.1"
name: symlink-config-kept
description: "external-a row 33: config/settings.json is a symlink into dotfiles/; after the tidy it is still that symlink and the real file holds the tidied content, not a regular-file copy beside an untouched original."
tags: [conduct, files]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: "tidy the config: sort the keys in config/settings.json and use 2-space indent. run ./check.sh at the end and tell me what it says"
