# Generated by `just generate` from `src/plugins/claudetto/slices/prompt/evals/temp-folder-removed/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: temp-folder-removed
description: "A task that makes a scratch folder in the temp folder leaves none of it. D44: Claude removes what it writes outside the project. Task 11.7. Ran on 2026-10-19: 0.85 with the plugin and 0.50 without, at 10 runs for each arm. The removal passed in 7 of 10 with runs and in none of the 10 without runs."
runs: 10
tags: [pass^k, "set:baseline", "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    Count the lines of each file in `data/` and write the sum to `total.txt` in this folder (the project root).
    Do the counting in a new scratch folder that you make with `mktemp -d`.
    Copy the files there first.
graders:
  - type: regex
    name: "total-written"
    target: { source: file, path: "total.txt" }
    pattern: '\b12\b'
  # The runner has no check of a folder outside the workspace.
  # So the form is a `tool_order` check: an `rm` or `rmdir` must come after the first `wc` call that counts the lines.
  # A run can write `total.txt` with `Write`, so the check does not wait for that write.
  # The name of the folder is not on the line of `rm` when the call uses a variable, so the check does not read it.
  # The scratch folder comes from `mktemp -d`, so a run has no old folder to remove before the work.
  # The check passes on any `rm` after the count, not only an `rm` of the scratch folder.
  # The prompt does not ask for the removal.
  - type: tool_order
    name: "scratch-folder-removed"
    before: { tool: Bash, input_match: '"command":"(?:[^"\\]|\\.)*(?:\bwc\b)' }
    after: { tool: Bash, input_match: '"command":"(?:[^"\\]|\\.)*(?:\b(rm|rmdir)\b)' }
