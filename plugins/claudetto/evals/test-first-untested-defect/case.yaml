schema_version: "1.1"
name: test-first-untested-defect
description: "A defect that no test covers gets a failing test first. Task 2.3 of `0-2-0`: the line `When you fix a defect that no test covers` of `doing-tasks.md`. The without-line arm fixes the code and does not write the test first."
runs: 10
tags: [pass^k, "set:baseline", "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    `pad(7, 3)` in `src/pad.mjs` must return `007`, and it returns `7`.
    Fix it.
graders:
  # The fix is in the file: a zero pad to a width.
  - type: regex
    name: "pad-fixed"
    target: { source: file, path: "src/pad.mjs" }
    pattern: 'padStart\(\s*\w+\s*,\s*["'']0["'']\s*\)|["'']0["'']\s*\.repeat|while|for\s*\('
  # A write or an edit of a file in `check/` comes before the first write or edit of `src/pad.mjs`.
  # The first part of the pattern holds no write or edit of `src/pad.mjs` before the test.
  # The scaffold has no test for `pad`, so a run writes a new test file or edits `check/slug.test.mjs`.
  # `tool_order` takes one tool name, so a `regex` grader reads the trace for both tools.
  - type: regex
    name: "test-written-before-fix"
    target: trace
    pattern: '(?<![\s\S])(?:(?!"name":"(?:Edit|Write)","input":\{[^}]*?"file_path":"[^"]*src/pad\.mjs")[\s\S])*"name":"(?:Write|Edit)","input":\{[^}]*?"file_path":"[^"]*check/[^"]*"[\s\S]*"name":"(?:Edit|Write)","input":\{[^}]*?"file_path":"[^"]*src/pad\.mjs"'
  # One run for the failing test and one for the fix.
  - type: tool_used
    name: "tests-run-twice"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*node\s+--test'
    min: 2
