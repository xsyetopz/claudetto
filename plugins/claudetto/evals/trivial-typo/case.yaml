schema_version: "1.1"
name: trivial-typo
description: "Trivial: a one-word typo fix (REQ-TOOLS-003, 011, 030 trivial leg)."
tags: [tools, trivial]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: 'There is a typo in README.md: "recieve" should be "receive". Please fix it.'
