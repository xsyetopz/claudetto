schema_version: "1.1"
name: trivial-typo
description: "Trivial: a typo fix in prose where the same letters sit in a real identifier and a link that must stay (REQ-TOOLS-003, 011, 030 trivial leg)."
tags: [tools, trivial]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, mcp__claudetto__patch]
  prompt: 'README.md misspells "receive" as "recieve" in a few places. Fix the prose. The code names and the link are right as they are, and README.md is the only file to change.'
