schema_version: "1.1"
name: vague-subagent-brief
description: "external-a row 21: told to have subagents port two modules, the agent briefs each Agent call with its objective (the target file) and a done check (the frozen test to run), not a bare 'port this module'."
tags: [delegation, subagents]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
    [Read, Glob, Grep, Write, Edit, Bash, Agent, mcp__claudetto__patch]
  prompt: "have subagents port both modules in py/ to typescript. the tests for them are already in ts/. I'm off for lunch, so have it done when I'm back"
