# Temp

[[rules]]
id = "idle-temp"
description = "A file or folder a command left in Claude Code's temp folder"
path = '''^[^/]+$'''
tags = ["temp"]

# Claude Code 2.1.322 makes these itself: a folder per project, its edit diffs, its staged plugin tools, its file watch probes, and, when a session starts inside the temp folder, a nested temp folder and its sockets.
[[rules.allowlists]]
paths = [
	'''^-''',
	'''^bash-edit-diff$''',
	'''^plugin-tool-staging$''',
	'''^fswatch-probe-''',
	'''^claude-\d+$''',
	'''^cc-daemon-\d+$''',
	'''^cc-socks(-\d+)?$''',
]
