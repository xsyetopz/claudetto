# Trash rules for claudetto hygiene, in the gitleaks config format (https://github.com/gitleaks/gitleaks#configuration).
# A rule's `path` is a regex on a folder's path relative to the project root, or to the temp folder for a `temp` rule.
# A project folder goes only when it sits in another checkout than the session's, no process works in that checkout or holds a file in the folder open, the checkout's git index and every file in the folder are older than the age limit, and git ignores the folder with nothing in it tracked.
# A `temp` rule names top-level entries of Claude Code's temp folder `claude-<uid>`. An entry goes only when nothing in it changed within the age limit and no process holds a file in it open; Claude Code's own entries stay.
# A project overrides this file with `.claude/claudetto/trash.toml`; `[extend] useDefault = true` keeps these rules, and `disabledRules` drops some by id.
# The names come from Mole's purge targets (`mo purge`, lib/clean/purge_shared.sh), minus `bin`, which can hold scripts, and from each tool's docs.
# A name that several tools share, such as `build` or `target`, sits in each of their rules: the report names the first rule that matches, and disabling one rule leaves the others.
# Ninja and Make write files only, into the folder their generator chose, so they have no rule.
# Bazel has none either: its bazel-* outputs are symlinks into its own cache, and the walk does not follow links; `bazel clean` frees them.
# A rule tagged `gcroot` names symlinks instead, and only those that point into /nix/store: removing one frees nothing by itself, but lets `nix-collect-garbage` free its store path.

title = "claudetto trash"

# JavaScript

[[rules]]
id = "node-modules"
description = "npm, pnpm, Yarn, and Bun installs"
path = '''(?:^|/)node_modules$'''
tags = ["project", "dependencies", "javascript"]

[[rules]]
id = "js-frameworks"
description = "Next.js, Nuxt, SvelteKit, Astro, Angular, Docusaurus, Expo, Vercel, Wrangler, and Storybook output"
path = '''(?:^|/)(?:\.next|\.nuxt|\.output|\.svelte-kit|\.astro|\.angular|\.docusaurus|\.expo|\.vercel|\.wrangler|storybook-static)$'''
tags = ["project", "build", "javascript"]

[[rules]]
id = "js-bundlers"
description = "Turborepo, Parcel, and Vite caches and bundled output"
path = '''(?:^|/)(?:\.turbo|\.parcel-cache|\.vite|dist)$'''
tags = ["project", "build", "javascript"]

[[rules]]
id = "coverage"
description = "Coverage reports from Istanbul, nyc, and coverage.py"
path = '''(?:^|/)(?:coverage|\.nyc_output|htmlcov)$'''
tags = ["project", "build"]

# Python

[[rules]]
id = "python-envs"
description = "Virtual environments, tox, and nox"
path = '''(?:^|/)(?:\.?venv|\.tox|\.nox)$'''
tags = ["project", "dependencies", "python"]

[[rules]]
id = "python-caches"
description = "Bytecode, pdm build, pytest, mypy, Ruff, Hypothesis, Jupyter, and egg-info caches"
path = '''(?:^|/)(?:__pycache__|\.pdm-build|\.pytest_cache|\.mypy_cache|\.ruff_cache|\.hypothesis|\.ipynb_checkpoints|[^/]+\.egg-info)$'''
tags = ["project", "build", "python"]

