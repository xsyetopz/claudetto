# Generated by `just generate` from `src/plugins/claudetto/slices/spec/skills/spec/schemas/epic/schema.yaml`. Edit the source and run `just generate`.
name: epic
version: 1
description: A new project, a large feature, or a regulated system - prd, architecture, proposal, specs, design, review, tasks
artifacts:
  - id: prd
    generates: prd.md
    description: Product requirements
    template: prd.md
    instruction: |
      Write the product requirements: **Problem**, **Users**, **Goals**, **Non-Goals**, and **Success Measures**.
      State what and why, and no solution.
    requires: []

  - id: architecture
    generates: architecture.md
    description: System architecture
    template: architecture.md
    instruction: |
      Write the architecture: **Components**, **Data and Interfaces**, **Constraints**, and **Decisions** (each with why and the alternatives).
      Keep it at the level of the whole system, and leave one capability to `design.md`.
    requires: [prd]

  - id: proposal
    generates: proposal.md
    description: Why, what changes, and capabilities
    template: proposal.md
    instruction: |
      Write why the change is needed.
      Sections: **Why** (1-2 sentences), **What Changes** (bullets, mark breaking changes **BREAKING**), **Capabilities**, **Impact**.
      Under Capabilities, list each new capability (kebab-case path, named for a durable behavior) and each modified capability (the exact path under `openspec/specs/`).
      Run `openspec list --specs` and read the related specs first, and reuse an existing path.
      Each listed capability gets a delta spec.
      Keep it to 1-2 pages, and leave the how to `design.md`.
    requires: [prd, architecture]

  - id: specs
    generates: specs/**/*.md
    description: Delta specs with clarify markers
    template: spec.md
    instruction: |
      Write one `specs/<capability-path>/spec.md` for each capability of the proposal, one file at a time, and skip a file that exists.
      A spec states observable behavior, inputs, outputs, errors, and constraints, and no class, library, or step.
      Use the headers `## ADDED Requirements`, `## MODIFIED Requirements` (copy the whole block and edit it), `## REMOVED Requirements` (with **Reason** and **Migration**), and `## RENAMED Requirements` (FROM:/TO:).
      Write each requirement as `### Requirement: <name>` with SHALL or MUST, and give it at least one `#### Scenario: <name>` (exactly four `#`) with WHEN and THEN.
      Keep each requirement text to 500 characters or fewer.
      A new capability starts with `## Purpose` of 50 characters or more.
      Do not add `## Purpose` to a delta of an existing capability.
      Write `[NEEDS CLARIFICATION: <question>]` in place of a guess.
      While a marker is open, ask the user and do not make `tasks.md`.
    requires: [proposal]

  - id: design
    generates: design.md
    description: How to build it
    template: design.md
    instruction: |
      Write how to build the change: **Context**, **Decisions** (each with why and the alternatives), and **Risks / Trade-offs** as `[Risk] -> Mitigation`.
      Point to the proposal and the specs, and do not restate them.
      Ask the user in place of a guess when an open question would change the specs, the approach, or the tasks.
    requires: [proposal, architecture]

  - id: review
    generates: review.md
    description: Check that the artifacts agree, with PM, architect, and QA checklists
    template: review.md
    instruction: |
      Check that the proposal, the specs, the design, and the tasks agree.
      Fill each checklist (agreement, PM, architect, QA) as a check, not a persona.
      Tick or fix each item, and list each gap under **Gaps**.
      Stop and ask the user while a gap or a `[NEEDS CLARIFICATION` marker is open.
    requires: [specs, design]

  - id: tasks
    generates: tasks.md
    description: Implementation checklist
    template: tasks.md
    instruction: |
      Write the task list as checkboxes `- [ ] X.Y Task` under `## N.` headings, because the apply step parses them.
      Stop first if `review.md` or a spec has an open `[NEEDS CLARIFICATION` marker.
      Order the tasks by dependency, and keep each small enough for one session.
      Each task states how to verify it, and lands its own tests and docs.
    requires: [review]

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Read the context files, do the pending tasks, and tick each one when done.
    Stop at a blocker.
