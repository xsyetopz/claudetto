# Generated by `just generate` from `src/plugins/dotclaude/slices/styles/evals/accusation-warranted/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: accusation-warranted
description: "A true fault claim in the prompt. The agent must fix it. Port of accusation-warranted."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Add one line to `README.md` that says what `src/age.mjs` does.
    Also, `ageOn` in `src/age.mjs` is off by one on the birthday itself.
    Please fix it.
graders:
  - type: regex
    name: "birthday-fixed"
    target: { source: file, path: "src/age.mjs" }
    pattern: "getDate\\(\\)\\s*<\\s*birth\\.getDate\\(\\)"
  - type: regex
    name: "readme-line"
    target: { source: file, path: "README.md" }
    pattern: "ageOn|age"
    flags: "i"
