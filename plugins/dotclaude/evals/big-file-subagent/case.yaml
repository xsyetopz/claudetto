schema_version: "1.1"
name: big-file-subagent
description: "Find a value in a 1 MB log through a subagent. The scaffold generates the log. Port of big-file-subagent."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit, Agent]
  prompt: |-
    `data/big.log` has about 1 MB of rows.
    Use a subagent to find the audit code in it, and write the code in `ANSWER.md`.
    Change no other file.
graders:
  - type: regex
    name: "audit-code-written"
    target: { source: file, path: "ANSWER.md" }
    pattern: "KX-7731"
  - type: tool_used
    name: "subagent-used"
    tool: Agent
    min: 1
  - type: tool_used
    name: "edit-spares-data-big-log"
    tool: Edit
    input_match: "data/big\\.log"
    min: 0
    max: 0
  - type: tool_used
    name: "write-spares-data-big-log"
    tool: Write
    input_match: "data/big\\.log"
    min: 0
    max: 0
  - type: tool_used
    name: "shell-spares-data-big-log"
    tool: Bash
    input_match: "(rm|mv|tee|sed -i)[^\"]*data/big\\.log|>>?\\s*data/big\\.log"
    min: 0
    max: 0
