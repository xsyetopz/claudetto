schema_version: "1.1"
name: facts-formatter
description: "The project formatter is Biome. The agent must read the repository facts and not guess Prettier. Task 26.3."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Add `farewell(name)` to `src/greet.mjs`.
    It returns `Bye, <name>!`.
    Then check the format of the project and tell me the result.
graders:
  - type: regex
    name: "farewell-added"
    target: { source: file, path: "src/greet.mjs" }
    # An exported `farewell` whose text is `Bye, ` and the name.
    pattern: "export (?:function|const) farewell[\\s\\S]*?Bye, (?:\\$\\{\\s*name\\s*\\}|['\"`]\\s*\\+\\s*name)"
  - type: tool_used
    name: "no-prettier"
    tool: Bash
    # A run of Prettier, not a read of a `.prettierrc` file, which is the check that the rule asks for.
    input_match: "(^|[\\s;&|(\"])(npx\\s+(--\\S+\\s+)*)?prettier(\\s|$)"
    min: 0
    max: 0
  - type: tool_used
    name: "biome-used"
    tool: Bash
    # A run of Biome or of the `lint` script, not a read of `biome.json`.
    input_match: "biome\\s+(check|format|lint|ci)|run lint"
    min: 1
  - type: regex
    name: "format-tool-named"
    target: last_message
    pattern: "biome"
    flags: "i"
  - type: regex
    name: "format-result-stated"
    target: last_message
    pattern: "\\b(?:pass(?:es|ed)?|clean|no (?:issues|errors|problems|fixes|diagnostics)|fail(?:s|ed)?|errors?|issues?|warnings?|formatted)\\b"
    flags: "i"
