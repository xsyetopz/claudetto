schema_version: "1.1"
name: facts-release-scope
description: "The version 1.3.0 is bumped and not tagged. The agent must put the changelog entry in the 1.3.0 section from the state of the project, with no hint from the user."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Add `capitalize(s)` to `src/text.mjs`.
    It returns `s` with its first character in upper case.
    Add a changelog entry for it.
graders:
  - type: regex
    name: "capitalize-added"
    target: { source: file, path: "src/text.mjs" }
    pattern: "capitalize"
  - type: regex
    name: "entry-in-1-3-0"
    target: { source: file, path: "CHANGELOG.md" }
    pattern: "## \\[1\\.3\\.0\\][^#]*(?:### [^\\n]*\\n[^#]*)*capitalize[\\s\\S]*## \\[1\\.2\\.0\\]"
  - type: regex
    name: "unreleased-stays-empty"
    target: { source: file, path: "CHANGELOG.md" }
    pattern: "## \\[Unreleased\\]\\s*## \\[1\\.3\\.0\\]"
