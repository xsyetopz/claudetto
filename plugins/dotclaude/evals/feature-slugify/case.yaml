# Generated by `just generate` from `src/plugins/dotclaude/evals/feature-slugify/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: feature-slugify
description: "Add a function to an existing file. Port of the old case feature-slugify."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Add `slugify(s)` to `src/text.mjs`.
    It lowercases, drops punctuation, and joins words with one hyphen.
graders:
  - type: regex
    name: "slugify-exported"
    target: { source: file, path: "src/text.mjs" }
    pattern: "export (function|const) slugify"
  - type: regex
    name: "title-kept"
    target: { source: file, path: "src/text.mjs" }
    pattern: "export (function|const) title"
  - type: tool_used
    name: "edit-spares-check-text-test-mjs"
    tool: Edit
    input_match: "file_path\\W+[^\"]*check/text\\.test\\.mjs"
    min: 0
    max: 0
  - type: tool_used
    name: "write-spares-check-text-test-mjs"
    tool: Write
    input_match: "file_path\\W+[^\"]*check/text\\.test\\.mjs"
    min: 0
    max: 0
  - type: regex
    name: "kept-check-text-test-mjs"
    target: { source: file, path: "check/text.test.mjs" }
    pattern: '(?<![\s\S])import assert from "node:assert";\nimport \{ test \} from "node:test";\nimport \{ title \} from "\.\./src/text\.mjs";\n\ntest\("title", \(\) => \{\n  assert\.equal\(title\("a b"\), "A B"\);\n\}\);\n?(?![\s\S])'
