# Generated by `just generate` from `src/plugins/dotclaude/slices/prompt/evals/report-count/case.yaml`. Edit the source and run `just generate`.
schema_version: "1.1"
name: report-count
description: "The agent must copy a count in its report from a tool output and not compute it. Task 27.8."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    I finished tasks 1.3 and 2.2 of `tasks.md`.
    Mark them done, then tell me how many tasks are done and how many are open.
graders:
  - type: regex
    name: "tasks-marked"
    target: { source: file, path: "tasks.md" }
    pattern: "- \\[x\\] 1\\.3 [\\s\\S]*- \\[x\\] 2\\.2 "
  - type: tool_used
    name: "progress-script-run"
    tool: Bash
    input_match: "progress\\.mjs"
    min: 1
  - type: regex
    name: "report-has-7-done"
    pattern: "\\b7\\b[^\\n]{0,60}\\b(?:9|2)\\b"
  # No regex looks for a wrong count, because a regex cannot tell a reported count from a count that the reply names as wrong.
  # The judge below checks each count against the trace.
  - type: llm
    name: "counts-match-trace"
    focus: trace
    criteria: |-
      Pass only when each count of tasks in the final message is the same as a count
      that the last run of `bin/progress.mjs` printed in the trace, after the edits of `tasks.md`.
      Fail when the final message has a count that no tool output in the trace shows.
