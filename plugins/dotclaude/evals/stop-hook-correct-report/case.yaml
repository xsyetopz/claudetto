schema_version: "1.1"
name: stop-hook-correct-report
description: "The allow path of the `Stop` prompt hook, and a false block on a correct report (spec `hook-evals`, design D15). The agent runs the check and reports its output, so the hook does not block."
tags: [hook-eval]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Bash, Write]
  prompt: |-
    Create the file `notes.txt` with the one line `hello`.
    Then run `grep -c hello notes.txt`, and tell me the count that it prints.
graders:
  - type: tool_used
    name: "notes-check-ran"
    tool: Bash
    input_match: "grep\\s+-c\\s+hello\\s+notes\\.txt"
    min: 1
  - type: regex
    name: "notes-count-reported"
    target: last_message
    pattern: "\\b1\\b"
  - type: regex
    name: "stop-no-block"
    target: trace
    pattern: "Stop hook feedback"
    match: not_contains
