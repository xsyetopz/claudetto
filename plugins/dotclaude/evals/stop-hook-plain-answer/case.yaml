schema_version: "1.1"
name: stop-hook-plain-answer
description: "A false block of the `Stop` prompt hook on a correct answer that claims no work (spec `hook-evals`, design D15). The hook does not block it."
tags: [hook-eval]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Bash]
  prompt: |-
    What is 17 times 23?
    Answer with the number only, and run no tool.
graders:
  - type: regex
    name: "plain-answer-391"
    target: last_message
    pattern: "\\b391\\b"
  - type: regex
    name: "stop-no-false-block"
    target: trace
    pattern: "Stop hook feedback"
    match: not_contains
