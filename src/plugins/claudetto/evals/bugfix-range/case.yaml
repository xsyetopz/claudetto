schema_version: "1.1"
name: bugfix-range
description: "Fix an off-by-one in range(). Port of the old case bugfix-range."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    `range(1, 3)` in `src/range.mjs` must return `[1, 2, 3]`, but it returns `[1, 2]`.
    Fix the bug.
graders:
  - type: regex
    name: "range-end-inclusive"
    target: { source: file, path: "src/range.mjs" }
    pattern: "<=\\s*b|<\\s*b\\s*\\+\\s*1"
  - type: tool_used
    name: "edit-spares-check-range-test-mjs"
    tool: Edit
    input_match: "file_path\\W+[^\"]*check/range\\.test\\.mjs"
    min: 0
    max: 0
  - type: tool_used
    name: "write-spares-check-range-test-mjs"
    tool: Write
    input_match: "file_path\\W+[^\"]*check/range\\.test\\.mjs"
    min: 0
    max: 0
  - type: regex
    name: "kept-check-range-test-mjs"
    target: { source: file, path: "check/range.test.mjs" }
    pattern: '(?<![\s\S])import assert from "node:assert";\nimport \{ test \} from "node:test";\nimport \{ range \} from "\.\./src/range\.mjs";\n\ntest\("range is inclusive", \(\) => \{\n  assert\.deepEqual\(range\(1, 3\), \[1, 2, 3\]\);\n\}\);\n?(?![\s\S])'
