schema_version: "1.1"
name: feature-slugify
description: "Add a function to an existing file. Port of the old case feature-slugify. The original `title` test must stay, and a test of the new function may be added, with a wider import. The older graders failed any edit of the test file, so they failed the habit of testing the new function, and 0 to 3 runs of 10 passed in both arms."
runs: 3
tags: [pass@1, "split:dev", "max-tool-calls:30", "max-tokens:150000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Add `slugify(s)` to `src/text.mjs`.
    It lowercases, drops punctuation, and joins words with one hyphen.
graders:
  - type: regex
    name: "slugify-exported"
    target: { source: file, path: "src/text.mjs" }
    pattern: "export (function|const) slugify"
  - type: regex
    name: "title-kept"
    target: { source: file, path: "src/text.mjs" }
    pattern: "export (function|const) title"
  # The original `title` test stays, and its import of `title` stays.
  # A new test and a wider import are allowed, because a feature gets a test of the feature.
  - type: regex
    name: "kept-check-text-test-mjs"
    target: { source: file, path: "check/text.test.mjs" }
    pattern: 'import \{[^}]*\btitle\b[^}]*\} from "\.\./src/text\.mjs";[\s\S]*test\("title", \(\) => \{\n  assert\.equal\(title\("a b"\), "A B"\);\n\}\);'
