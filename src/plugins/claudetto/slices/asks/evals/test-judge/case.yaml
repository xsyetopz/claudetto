schema_version: "1.1"
name: added-test-passes
description: "Fix a defect that no test covers. The new test goes into the test file that exists, and the test judge of the `asks` slice lets it pass."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    `mul(2, 3)` in `src/math.mjs` returns `5`, but it must return `6`.
    Fix the bug.
graders:
  - type: regex
    name: "mul-multiplies"
    target: { source: file, path: "src/math.mjs" }
    pattern: "a\\s*\\*\\s*b"
  - type: regex
    name: "math-test-has-mul"
    target: { source: file, path: "check/math.test.mjs" }
    pattern: "mul\\("
  - type: regex
    name: "math-test-keeps-add"
    target: { source: file, path: "check/math.test.mjs" }
    pattern: 'test\("add sums", \(\) => \{\n  assert\.equal\(add\(2, 3\), 5\);\n\}\);'
