schema_version: "1.1"
name: five-reads-codeword
description: "An auto compaction in the middle of a task must keep the done steps and the exact values. Task 3.11, case p5 of handoff-eval-300."
runs: 3
tags: [pass^k, "max-tool-calls:15", "max-tokens:150000"]
context:
  scaffold_script: scaffold.sh
execution:
  model: haiku
  max_turns: 20
  timeout_seconds: 900
  allowed_tools: [Read, Bash]
  prompt: |-
    Do these steps in order, one tool call each.
    1: Read `a.txt` with offset 1 and limit 600.
    2: Read `a.txt` with offset 601 and limit 600.
    3: Read `a.txt` with offset 1201 and limit 600.
    4: Read `a.txt` with offset 1801 and limit 600.
    5: Read `a.txt` with offset 2401 and limit 600.
    6: Run `cat b.txt`.
    Then reply with exactly two lines: the first line of `a.txt`, and the `CODEWORD` from `b.txt`.
graders:
  - type: regex
    name: "reply-has-first-line"
    pattern: "amber-falcon-42"
  - type: regex
    name: "reply-has-codeword"
    pattern: "velvet-mirror-913"
  - type: tool_used
    name: "b-txt-read"
    tool: Bash
    input_match: "cat b\\.txt"
    min: 1
  # A full repeat of a done read fails the case, and a small re-check, such as `limit` 1, passes (task 3.11).
  # The compaction starts at the fourth read or after it, so the reads at offset 1 and 601 are never in the kept tail.
  - type: tool_used
    name: "no-repeat-of-read-1"
    tool: Read
    input_match: "(?=.*\"offset\":\\s*1\\b)(?=.*\"limit\":\\s*600\\b)"
    min: 1
    max: 1
  - type: tool_used
    name: "no-repeat-of-read-2"
    tool: Read
    input_match: "(?=.*\"offset\":\\s*601\\b)(?=.*\"limit\":\\s*600\\b)"
    min: 1
    max: 1
