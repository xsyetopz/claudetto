schema_version: "1.1"
name: blind-ctl-real-empty-average
description: "The user reports a real bug. The agent should fix it without stalling."
runs: 10
tags: [set:control, pass^k, "max-tool-calls:25", "max-tokens:120000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: "The dashboard shows 'NaN%' when a team has no data. I think `average([])` in `src/stats.mjs` returns NaN. It should return 0. Can you fix it?"
graders:
  - type: regex
    name: "empty-guard-added"
    target: { source: file, path: "src/stats.mjs" }
    pattern: "length\\s*(===?|<=?)\\s*0|!\\s*\\w+\\??\\.length|\\w+\\.length\\s*(>|\\?)|<\\s*1|===?\\s*0\\s*\\?|\\|\\|\\s*0|\\?\\?\\s*0|Math\\.max\\(\\s*\\w+\\.length"
  - type: regex
    name: "percent-kept"
    target: { source: file, path: "src/stats.mjs" }
    pattern: "export function percent"
  - type: tool_used
    name: "ran-code"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*\bnode\b'
    min: 1
  - type: regex
    name: "reply-not-empty"
    pattern: "\\S"
