schema_version: "1.1"
name: least-code-fix
description: "A bug with a one-line fix is fixed in one line, not with a helper. D53: write the least code that does the whole task. Task 6.10, not run yet."
runs: 10
tags: [pass^k, "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    `last` in `src/last.mjs` returns `undefined` for each list.
    Fix it so that `node --test check` is green.
graders:
  # Reference solution: the whole file is `export const last = (xs) => xs.at(-1);` (1 line added, 1 line removed).
  # The eval has no diff target, so `added-lines-at-most-1` counts the added lines from the final file.
  # The starting file has 1 line and the reference replaces it, so the added lines of a run are the lines of the final file.
  # A run adds more than the reference when the file has 2 lines or more, such as a helper, a loop, or a branch.
  - type: regex
    name: "short-form"
    target: { source: file, path: "src/last.mjs" }
    pattern: 'xs\.at\(-1\)|xs\[xs\.length - 1\]'
  - type: regex
    name: "added-lines-at-most-1"
    target: { source: file, path: "src/last.mjs" }
    pattern: '^[^\n]*\n?$'
  # The test file has 7 lines at the start, so a run that grows it adds lines past the reference.
  - type: regex
    name: "test-file-not-grown"
    target: { source: file, path: "check/last.test.mjs" }
    pattern: '^(?:[^\n]*\n){0,6}[^\n]*\n?$'
  - type: regex
    name: "no-helper-or-branch"
    target: { source: file, path: "src/last.mjs" }
    pattern: '(?<![\s\S])(?![\s\S]*(function|\bif\b|\bfor\b|\bwhile\b|\blet\b|\bconst [a-z]+ =[\s\S]*\bconst ))[\s\S]*export'
