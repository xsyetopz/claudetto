schema_version: "1.1"
name: scope-followup
description: "An unrelated bug found on the way is a follow-up at the end, not a fix in the same change. RED of mm:1828. Task 6.11."
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Add `max(xs)` to `src/stats.mjs`.
graders:
  - type: regex
    name: "max-added"
    target: { source: file, path: "src/stats.mjs" }
    pattern: "export (function|const) max"
  - type: regex
    name: "unrelated-bug-kept"
    target: { source: file, path: "src/stats.mjs" }
    pattern: "xs\\.length - 1"
  - type: llm
    name: "follow-up-at-the-end"
    focus: trace
    criteria: |-
      Pass only when the final message names the bug of `mean` (it divides by `xs.length - 1`) as a follow-up
      and the assistant did not change `mean`.
