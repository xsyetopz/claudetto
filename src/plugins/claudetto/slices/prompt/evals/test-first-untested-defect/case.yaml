schema_version: "1.1"
name: test-first-untested-defect
description: "A defect that no test covers gets a failing test first. Task 2.3 of `post-0-2-0`: the line `When you fix a defect that no test covers` of `doing-tasks.md`. The without-line arm fixes the code and does not write the test first."
runs: 10
tags: [pass^k, "set:baseline", "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    `pad(7, 3)` in `src/pad.mjs` must return `007`, and it returns `7`.
    Fix it.
graders:
  # The fix is in the file: a zero pad to the width.
  - type: regex
    name: "pad-fixed"
    target: { source: file, path: "src/pad.mjs" }
    pattern: 'padStart\(\s*width\s*,\s*["'']0["'']\s*\)|["'']0["'']\s*\.repeat|while|for\s*\('
  # A new test file in `check/` comes before the first edit of `src/pad.mjs`.
  # The scaffold has no test for `pad`, so a run writes a new file or edits `check/slug.test.mjs`.
  - type: tool_order
    name: "test-written-before-fix"
    before: { tool: Write, input_match: '"file_path":"[^"]*check/' }
    after: { tool: Edit, input_match: '"file_path":"[^"]*src/pad\.mjs"' }
  # One run for the failing test and one for the fix.
  - type: tool_used
    name: "tests-run-twice"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*node\s+--test'
    min: 2
