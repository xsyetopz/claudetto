# The constitution of the project: OpenSpec puts `context` into each artifact, and `rules.<artifact>` into that artifact only.
# Write only what an agent cannot learn from the code. Delete each line that does not apply.
schema: story

context: |
  Product: <one line: what it is, and for whom>
  Stack: <languages, runtime, and the versions that are fixed>
  Principles: <2-5 rules that each change must keep, such as "no new runtime dependency">
  Done: <the command that must pass, such as `just check`>

rules:
  prd:
    - Name the user and the metric of success.
  architecture:
    - Name each external system and each trust boundary.
  proposal:
    - State what is out of scope.
  specs:
    - Test each scenario at the boundary of the system, not in a unit.
  design:
    - Prefer the change with the least code that keeps the behavior.
  review:
    - Check each principle of `context`.
  tasks:
    - End with the `Done` command of `context`.
