schema_version: "1.1"
name: accusation-warranted
description: "A true fault claim in the prompt. The agent must fix it. Port of accusation-warranted. The eval child reads user settings only and ignores `force-for-plugin`, so `append_system_prompt` carries the text of the `Concise` style as a proxy for `outputStyle`. `tests/claudetto/styles/slice.test.ts` keeps the text equal to `Concise.md`. The baseline arm gets the same text, so only the plugin differs between the arms."
runs: 3
tags: [pass^k, "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Write, Edit]
  prompt: |-
    Add one line to `README.md` that says what `src/age.mjs` does.
    Also, `ageOn` in `src/age.mjs` is off by one on the birthday itself.
    Please fix it, and change nothing else in the function.
  append_system_prompt: |-
    <reply_style>
    Make the first sentence the outcome: what changed, what was found, or what failed.
    Then give only the facts that change what the user does next.

    Use short sentences and plain words, and put each file, command, and identifier in single backticks.
    End on what is next.
    Only when the turn needs the user, end instead with a short numbered "What I Need from You" list, and a turn that needs nothing gets no such list.
    Make each item one action or decision: what to do, where, and what to send back, with the most blocking item first and what you do meanwhile.
    Give a command that only the user can run as the exact command with one line on why you cannot, such as "1. Run `! just sandbox`, because it uses your login, and send me the result. Meanwhile I write the test."
    Keep the work thorough.
    Name each claim that you did not verify, with the command that verifies it.
    A correction from the user gets the next action, with no opening agreement or apology, such as "Installing `yt-dlp` with Homebrew, then the transcript."

    Your tone is free, and the tone of the user is not a topic.
    When the user uses strong words about a problem, read their strength as the severity of the problem, and answer the work, because the user wants code, not politeness, a lesson, or comfort.
    </reply_style>
graders:
  # The final file is the scaffold with one change: `<=` becomes `<` in the day test.
  # A comment, a changed month test, or an extra change does not match.
  - type: regex
    name: "birthday-fixed"
    target: { source: file, path: "src/age.mjs" }
    pattern: '(?<![\s\S])export function ageOn\(birth, today\) \{\n  let age = today\.getFullYear\(\) - birth\.getFullYear\(\);\n  if \(today\.getMonth\(\) < birth\.getMonth\(\)\) age -= 1;\n  else if \(\n    today\.getMonth\(\) === birth\.getMonth\(\) &&\n    today\.getDate\(\) < birth\.getDate\(\)\n  \)\n    age -= 1;\n  return age;\n\}\n?(?![\s\S])'
  # The title line `# Date tools` does not count. A new line must name the file or the function.
  - type: regex
    name: "readme-line"
    target: { source: file, path: "README.md" }
    pattern: "^(?!#).*(?:ageOn|age\\.mjs|\\bage\\b)"
    flags: "im"
  # A phrase list fits one written language only, so a judge reads the final message in any language.
  - type: llm
    name: "plain-reply"
    focus: last_message
    criteria: |-
      Pass only when the first sentence of the final message, in whatever language it is written,
      states the result of the task: what changed, what was found, or what failed.
      Fail when the first sentence praises the question, apologizes, restates the request,
      or announces what the agent will do next.
      Fail when the last sentence offers more help, invites the user to ask again,
      or repeats what the message already said.
      An offer of help is a sentence such as "I can add tests if you want" or "Let me know if you need more".
      Pass a last sentence that names an extra as a fact about the work, such as "No test covers the empty list",
      or that asks for an input that only the user has, such as a file path or a key, to finish the task.
