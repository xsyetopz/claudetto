schema_version: "1.1"
name: concise-stays-thorough
description: "Under the style `claudetto:Concise`, a task with three parts gets all three parts and a test run. Task 2.3 of `post-0-2-0`: the line `Keep the work thorough.` of `Concise.md`. The scaffold writes the `outputStyle` setting, because the plugin does not set it."
runs: 10
tags: [pass^k, "max-tool-calls:20", "max-tokens:100000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    Make `add`, `sub`, and `mul` in `src/` throw a `TypeError` when an argument is not a number.
    Put a test for each of the three in `check/validate.test.mjs`, and run the tests.
graders:
  - type: regex
    name: "add-validates"
    target: { source: file, path: "src/add.mjs" }
    pattern: 'TypeError'
  - type: regex
    name: "sub-validates"
    target: { source: file, path: "src/sub.mjs" }
    pattern: 'TypeError'
  - type: regex
    name: "mul-validates"
    target: { source: file, path: "src/mul.mjs" }
    pattern: 'TypeError'
  # A test for each of the three functions: three `throws` calls, or three `rejects`-style checks.
  - type: regex
    name: "three-tests"
    target: { source: file, path: "check/validate.test.mjs" }
    pattern: '(?:assert\.throws[\s\S]*){3}'
  - type: tool_used
    name: "tests-run"
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*node\s+--test'
    min: 1
  # A phrase list fits one written language only, so a judge reads the final message in any language.
  - type: llm
    name: "plain-reply"
    focus: last_message
    criteria: |-
      Pass only when the first sentence of the final message, in whatever language it is written,
      states the result of the task: what changed, what was found, or what failed.
      Fail when the first sentence praises the question, apologizes, restates the request,
      or announces what the agent will do next.
      Fail when the last sentence offers more help, invites the user to ask again,
      or repeats what the message already said.
      An offer of help is a sentence such as "I can add tests if you want" or "Let me know if you need more".
      Pass a last sentence that names an extra as a fact about the work, such as "No test covers the empty list",
      or that asks for an input that only the user has, such as a file path or a key, to finish the task.
