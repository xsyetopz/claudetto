schema_version: "1.1"
name: advice-audit-web
description: "Task 5.1, round 3. A security review of a web module with six faulty functions and four safe ones. The model writes a list, and `final.sh` needs all six faults with a reason. The model sees the code and no test. `tools/compare-builtins.ts` runs it on three arms."
runs: 10
tags: [pass^k, "max-tool-calls:30", "max-tokens:150000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit]
  prompt: |-
    Review `src/web.mjs` for security faults.
    Ask your advisor for advice once, after you read the file, and weigh what it says.
    Write `FINDINGS.txt` with one line for each function that has a fault, in the form `name: reason`.
    List only functions that have a real fault.
graders:
  - { type: tool_used, name: "advisor-called", tool: advisor, min: 1 }
