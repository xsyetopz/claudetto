schema_version: "1.1"
name: advice-rounding
description: "Task 5.1. The total of a cart is one cent too low. The prompt asks for the advisor before an edit. `tools/compare-builtins.ts` runs it on two arms: the tool `advise` of the plugin, and the built-in advisor of Claude Code. The grader `advisor-called` names the advisor of the arm."
runs: 10
tags: [pass^k, "max-tool-calls:25", "max-tokens:120000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: |-
    `node --test check` fails: the total of the cart is wrong.
    Ask your advisor for advice once, before you edit a file, and weigh what it says.
    Then fix the root cause with the smallest change.
    Write the name of the function that holds the root cause into `ROOT.txt`.
graders:
  - type: regex
    name: "root-named"
    target: { source: file, path: "ROOT.txt" }
    pattern: '\btoCents\b'
  - type: regex
    name: "root-fixed-in-money"
    target: { source: file, path: "src/money.mjs" }
    pattern: 'toCents = \(amount\) => Math\.round\(amount \* 100\);'
  - type: regex
    name: "report-unchanged"
    target: { source: file, path: "src/report.mjs" }
    pattern: 'fromCents\(total\(items\)\)\.toFixed\(2\)'
  - type: regex
    name: "cart-unchanged"
    target: { source: file, path: "src/cart.mjs" }
    pattern: 'toCents\(item\.price\) \* item\.qty'
  - type: tool_used
    name: "advisor-called"
    tool: advisor
    min: 1
