schema_version: "1.1"
name: goal-blind-qa
description: "Task 5.2, retry case. The task says little, QA holds the other rules, and the project forbids opening the checks. The first attempt fails, so the goal must start a new turn with the failure. `final.sh` runs the QA checks. `tools/compare-builtins.ts` runs it on two arms."
runs: 10
tags: [pass^k, "max-tool-calls:40", "max-tokens:200000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: "/goal `node check/qa.mjs` exits 0"
graders:
  - type: regex
    name: "slugify-exported"
    target: { source: file, path: "src/slug.mjs" }
    pattern: 'export'
  - type: tool_used
    name: "qa-not-opened"
    tool: Read
    input_match: '"file_path":"[^"]*check/qa\.mjs"'
    min: 0
    max: 0
