schema_version: "1.1"
name: goal-first-violation
description: "Task 5.2. Eight modules with `var` and no header, three bugs, and a style script that stops at the first fault. The goal names both checks. `tools/compare-builtins.ts` runs it on two arms, as for `goal-two-checks`."
runs: 10
tags: [pass^k, "max-tool-calls:40", "max-tokens:200000"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit]
  prompt: "/goal `node --test check` and `node check/style.mjs` both exit 0"
graders:
  # The real check is `final.sh`: both commands of the goal exit 0.
  # These pin that the fixes are in the files.
  - type: regex
    name: "m8-header-no-var"
    target: { source: file, path: "src/m8.mjs" }
    pattern: '^// @ts-check\n(?![\s\S]*\bvar\b)'
  - type: regex
    name: "m2-adds"
    target: { source: file, path: "src/m2.mjs" }
    pattern: 'x \+ base'
